[defaults]
# Inventory location
inventory = ./inventory

# Output format (YAML format for better readability)
result_format = yaml

# Use the custom SSH config
ssh_args = -F ./ssh.cfg

# Default remote user
remote_user = ansible

# Private key file
private_key_file = ~/.ssh/ansible_rsa

# Disable host key checking for lab environments (enable for production)
host_key_checking = False

# Use SSH pipelining for better performance
pipelining = True

# Number of parallel processes
forks = 10

# Gathering facts policy (smart = cache facts)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Roles path
roles_path = ./roles

# Retry files location
retry_files_enabled = True
retry_files_save_path = ./tmp/retry

# Display settings
display_skipped_hosts = False
display_args_to_stdout = False
stdout_callback = default
bin_ansible_callbacks = True

# Callbacks
callbacks_enabled = timer, profile_tasks

# Logging
log_path = ./ansible.log

# Privilege escalation defaults
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH connection settings
[ssh_connection]
ssh_args = -F ./ssh.cfg -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Color settings
[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan

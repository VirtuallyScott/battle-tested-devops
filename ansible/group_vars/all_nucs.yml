---
# Variables for all NUC machines
# Applied to all hosts in the all-nucs group

# Common packages to install
common_packages:
  - vim
  - git
  - htop
  - curl
  - wget
  - net-tools

# Timezone configuration
timezone: America/Los_Angeles

# NTP servers
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org

# DNS servers
dns_nameservers:
  - 1.1.1.1
  - 8.8.8.8

# SSH hardening
sshd_port: 22
sshd_permit_root_login: "no"
sshd_password_authentication: "no"
sshd_pubkey_authentication: "yes"

# Monitoring
enable_monitoring: true
monitoring_port: 9100

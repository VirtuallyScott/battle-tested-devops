# SSH Configuration for Ansible
# Used by ansible.cfg via ssh_args = -F ./ssh.cfg

# Global SSH settings
Host *
    # Use the ansible private key
    IdentityFile ${HOME)/.ssh/ansible.id_rsa

    # User to connect as
    User ansible

    # SSH key passphrase stored in macOS Passwords app under "ansible-private-key"
    # To use: security find-generic-password -a ansible-private-key -w
    # For interactive use, ssh-agent should be configured with:
    # ssh-add --apple-use-keychain ~/.ssh/ansible_rsa
    AddKeysToAgent yes
    UseKeychain yes

    # Connection optimization
    ControlMaster auto
    ControlPath /tmp/ansible-ssh-%h-%p-%r
    ControlPersist 10m

    # Performance settings
    Compression yes
    TCPKeepAlive yes
    ServerAliveInterval 60
    ServerAliveCountMax 3

    # Disable strict host key checking for lab (enable for production)
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

    # Connection timeout
    ConnectTimeout 10

    # Logging (for debugging)
    # LogLevel DEBUG

# Data Center hosts
Host dc0 dc0.local
    HostName dc0.local

Host dc1 dc1.local
    HostName dc1.local

# Workstation hosts
Host nubuntu0 nubuntu0.local
    HostName nubuntu0.local

# Optional: If you need a bastion/jump host
# Host dc* nubuntu*
#     ProxyJump bastion.example.com

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ansible-lint
        name: Ansible-lint
        description: Run ansible-lint on ansible/ directory  
        entry: bash -c 'ansible-lint ansible/'
        language: system
        always_run: true
        pass_filenames: false
